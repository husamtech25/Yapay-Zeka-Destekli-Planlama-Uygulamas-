name: Testler

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund
      - name: Testleri çalıştır
        run: npm test
